<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Day 11 Observability Pipeline with AI Incident Summary</title>
  <desc id="desc">Architecture showing services emitting logs, metrics, and traces into an incident analyzer, reports, dashboard, and human review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#061014"/><stop offset="50%" stop-color="#102b31"/><stop offset="100%" stop-color="#18291f"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#17393e"/><stop offset="100%" stop-color="#0d2024"/></linearGradient>
    <linearGradient id="ai" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#76f4d2"/><stop offset="100%" stop-color="#72a7ff"/></linearGradient>
    <linearGradient id="warn" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#ffb454"/><stop offset="100%" stop-color="#ff5f6d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#76f4d2"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity="0.14" stroke="#76f4d2" stroke-width="2"><path d="M60 0 L-190 1000"/><path d="M310 0 L60 1000"/><path d="M560 0 L310 1000"/><path d="M810 0 L560 1000"/><path d="M1060 0 L810 1000"/><path d="M1310 0 L1060 1000"/><path d="M1560 0 L1310 1000"/></g>
  <text x="90" y="95" fill="#76f4d2" font-family="Arial" font-size="34" font-weight="800" letter-spacing="3">DAY 11 CLOUD DEVOPS PROJECT</text>
  <text x="90" y="165" fill="#f6fffc" font-family="Arial" font-size="60" font-weight="900">Observability Pipeline with AI Incident Summary</text>
  <text x="90" y="215" fill="#b7d5cf" font-family="Arial" font-size="28">Correlate logs, metrics, and traces into an incident summary engineers can act on.</text>

  <g filter="url(#shadow)"><rect x="90" y="310" width="290" height="170" rx="24" fill="url(#card)" stroke="#fff" stroke-opacity="0.12"/><text x="235" y="370" fill="#76f4d2" font-family="Arial" font-size="26" font-weight="900" text-anchor="middle">DEMO SERVICES</text><text x="235" y="420" fill="#f6fffc" font-family="Arial" font-size="30" font-weight="900" text-anchor="middle">checkout outage</text><text x="235" y="455" fill="#b7d5cf" font-family="Arial" font-size="22" text-anchor="middle">api, checkout, db</text></g>
  <g filter="url(#shadow)"><rect x="470" y="260" width="220" height="120" rx="20" fill="url(#card)"/><text x="580" y="333" fill="#f6fffc" font-family="Arial" font-size="30" font-weight="900" text-anchor="middle">Logs</text></g>
  <g filter="url(#shadow)"><rect x="470" y="430" width="220" height="120" rx="20" fill="url(#card)"/><text x="580" y="503" fill="#f6fffc" font-family="Arial" font-size="30" font-weight="900" text-anchor="middle">Metrics</text></g>
  <g filter="url(#shadow)"><rect x="470" y="600" width="220" height="120" rx="20" fill="url(#card)"/><text x="580" y="673" fill="#f6fffc" font-family="Arial" font-size="30" font-weight="900" text-anchor="middle">Traces</text></g>
  <g filter="url(#shadow)"><rect x="800" y="365" width="320" height="210" rx="26" fill="url(#ai)"/><circle cx="960" cy="438" r="50" fill="#061014" opacity="0.95"/><path d="M930 438 H990 M960 408 V468 M938 416 L982 460 M982 416 L938 460" stroke="#76f4d2" stroke-width="8" stroke-linecap="round"/><text x="960" y="532" fill="#061014" font-family="Arial" font-size="32" font-weight="900" text-anchor="middle">Incident Analyzer</text></g>
  <g filter="url(#shadow)"><rect x="1210" y="300" width="300" height="170" rx="24" fill="url(#warn)"/><text x="1360" y="365" fill="#061014" font-family="Arial" font-size="26" font-weight="900" text-anchor="middle">AI-STYLE SUMMARY</text><text x="1360" y="420" fill="#061014" font-family="Arial" font-size="30" font-weight="900" text-anchor="middle">root cause + actions</text></g>
  <g filter="url(#shadow)"><rect x="1210" y="570" width="300" height="170" rx="24" fill="url(#card)"/><text x="1360" y="635" fill="#76f4d2" font-family="Arial" font-size="26" font-weight="900" text-anchor="middle">DASHBOARD</text><text x="1360" y="690" fill="#f6fffc" font-family="Arial" font-size="30" font-weight="900" text-anchor="middle">evidence review</text></g>
  <g fill="none" stroke="#76f4d2" stroke-width="6" marker-end="url(#arrow)"><path d="M380 395 C420 330 430 320 455 320"/><path d="M380 395 C420 485 430 490 455 490"/><path d="M380 395 C420 650 430 660 455 660"/><path d="M690 320 C745 340 770 390 795 430"/><path d="M690 490 H785"/><path d="M690 660 C745 640 770 565 795 515"/><path d="M1120 445 H1195"/><path d="M1120 500 C1170 560 1180 620 1195 650"/></g>
  <text x="90" y="900" fill="#b7d5cf" font-family="Arial" font-size="25">Beginner-friendly: local synthetic telemetry. Pro-ready: evolve into OpenTelemetry, Prometheus, CloudWatch, Jaeger, and LLM incident intelligence.</text>
