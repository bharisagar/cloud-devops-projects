  <text x="790" y="380" class="text">Text-to-Speech</text>
  <text x="790" y="410" class="small">Browser SpeechSynthesis</text>

  <rect x="740" y="500" width="260" height="85" class="warn" />
  <text x="782" y="535" class="text">Human Review</text>
  <text x="782" y="562" class="small">Unknown or clinical decisions</text>

  <rect x="1040" y="250" width="140" height="110" class="accent" />
  <text x="1066" y="294" class="text">CI/CD</text>
