<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Production AWS AI Governance Architecture</title>
  <desc id="desc">Production architecture for an AWS AI governance chatbot platform using OIDC or Cognito identity, AWS WAF, API Gateway, VPC Link, internal ALB, ECS Fargate, governance rules, Bedrock Guardrails, DynamoDB audit records, CloudWatch monitoring, CloudTrail, S3 evidence, and optional SageMaker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061014"/>
      <stop offset="0.58" stop-color="#0b1820"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #a8c3ca; }
      .zone-title { font: 700 18px Arial, sans-serif; fill: #e5f5f5; letter-spacing: .6px; }
      .zone-note { font: 400 13px Arial, sans-serif; fill: #88a8b0; }
      .box-title { font: 700 16px Arial, sans-serif; fill: #f8fafc; }
      .box-text { font: 400 13px Arial, sans-serif; fill: #c9dbe0; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #8fb1b8; }
      .badge-text { font: 700 12px Arial, sans-serif; fill: #062016; }
      .zone { fill: rgba(2, 6, 23, .62); stroke: #27424b; stroke-width: 1.4; }
      .card { fill: #0f1f26; stroke: #2f4a55; stroke-width: 1.3; filter: url(#shadow); }
      .card-strong { fill: #102a2d; stroke: #34d399; stroke-width: 1.7; filter: url(#shadow); }
      .card-alert { fill: #2a1618; stroke: #f87171; stroke-width: 1.5; filter: url(#shadow); }
      .badge { fill: #34d399; }
      .aws { fill: #ff9900; }
      .blue { fill: #38bdf8; }
      .purple { fill: #a78bfa; }
      .green { fill: #34d399; }
      .red { fill: #f87171; }
      .line { stroke: #38bdf8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .line-purple { stroke: #a78bfa; stroke-width: 2.4; fill: none; marker-end: url(#arrowPurple); }
      .line-green { stroke: #34d399; stroke-width: 2.4; fill: none; marker-end: url(#arrowGreen); }
      .line-muted { stroke: #6b8790; stroke-width: 2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#bg)"/>
  <text x="70" y="70" class="title">Production AWS AI Governance Architecture</text>
  <text x="70" y="104" class="subtitle">Governed chatbot path with identity, WAF, private ECS runtime, policy rules, Bedrock Guardrails, audit evidence, monitoring, and runbooks</text>

  <rect x="60" y="150" width="300" height="760" rx="24" class="zone"/>
  <text x="88" y="188" class="zone-title">USERS AND ACCESS</text>
  <text x="88" y="212" class="zone-note">Only authenticated traffic reaches /prompt</text>

  <rect x="95" y="255" width="230" height="92" rx="16" class="card"/>
  <circle cx="128" cy="301" r="21" class="blue"/>
  <text x="164" y="294" class="box-title">Chat UI / Client App</text>
  <text x="164" y="318" class="box-text">User asks AI question</text>

  <rect x="95" y="400" width="230" height="92" rx="16" class="card"/>
  <circle cx="128" cy="446" r="21" class="green"/>
  <text x="164" y="439" class="box-title">OIDC / Cognito</text>
  <text x="164" y="463" class="box-text">JWT identity and tenant context</text>

  <rect x="95" y="545" width="230" height="92" rx="16" class="card-alert"/>
  <circle cx="128" cy="591" r="21" class="red"/>
  <text x="164" y="584" class="box-title">AWS WAF</text>
  <text x="164" y="608" class="box-text">Rate limit and managed rules</text>

  <rect x="420" y="150" width="405" height="760" rx="24" class="zone"/>
  <text x="448" y="188" class="zone-title">API AND PRIVATE NETWORK</text>
  <text x="448" y="212" class="zone-note">Public API, private service integration</text>

  <rect x="465" y="255" width="300" height="92" rx="16" class="card"/>
  <circle cx="498" cy="301" r="21" class="aws"/>
  <text x="535" y="294" class="box-title">Amazon API Gateway</text>
  <text x="535" y="318" class="box-text">HTTP API with JWT authorizer</text>

  <rect x="465" y="400" width="300" height="92" rx="16" class="card"/>
  <circle cx="498" cy="446" r="21" class="blue"/>
  <text x="535" y="439" class="box-title">VPC Link</text>
  <text x="535" y="463" class="box-text">Private integration to VPC</text>

  <rect x="465" y="545" width="300" height="92" rx="16" class="card"/>
  <circle cx="498" cy="591" r="21" class="blue"/>
  <text x="535" y="584" class="box-title">Internal ALB</text>
  <text x="535" y="608" class="box-text">Private routing to ECS tasks</text>

  <rect x="465" y="690" width="300" height="92" rx="16" class="card"/>
  <circle cx="498" cy="736" r="21" class="green"/>
  <text x="535" y="729" class="box-title">VPC Endpoints</text>
  <text x="535" y="753" class="box-text">Bedrock, S3, DynamoDB, Logs, STS</text>

  <rect x="885" y="150" width="420" height="760" rx="24" class="zone"/>
  <text x="913" y="188" class="zone-title">GOVERNANCE RUNTIME</text>
  <text x="913" y="212" class="zone-note">Policy, redaction, model routing, response control</text>

  <rect x="930" y="255" width="330" height="112" rx="18" class="card-strong"/>
  <circle cx="964" cy="311" r="22" class="green"/>
  <text x="1002" y="294" class="box-title">ECS Fargate AI Gateway</text>
  <text x="1002" y="319" class="box-text">FastAPI service in private subnets</text>
  <text x="1002" y="341" class="box-text">Request ID, tenant, latency, outcome</text>

  <rect x="930" y="415" width="330" height="112" rx="18" class="card"/>
  <circle cx="964" cy="471" r="22" class="purple"/>
  <text x="1002" y="454" class="box-title">Governance Rules</text>
  <text x="1002" y="479" class="box-text">JSON policy or S3 policy object</text>
  <text x="1002" y="501" class="box-text">Block, monitor, or policy mode</text>

  <rect x="930" y="575" width="330" height="112" rx="18" class="card-alert"/>
  <circle cx="964" cy="631" r="22" class="red"/>
  <text x="1002" y="614" class="box-title">Redaction and Audit Preview</text>
  <text x="1002" y="639" class="box-text">Masks SSN, keys, tokens, cards</text>
  <text x="1002" y="661" class="box-text">Stores safe prompt/answer preview</text>

  <rect x="930" y="735" width="330" height="112" rx="18" class="card"/>
  <circle cx="964" cy="791" r="22" class="aws"/>
  <text x="1002" y="774" class="box-title">Bedrock Guardrails</text>
  <text x="1002" y="799" class="box-text">Input and output safety controls</text>
  <text x="1002" y="821" class="box-text">Optional SageMaker provider path</text>

  <rect x="1365" y="150" width="375" height="760" rx="24" class="zone"/>
  <text x="1393" y="188" class="zone-title">EVIDENCE AND OPERATIONS</text>
  <text x="1393" y="212" class="zone-note">Traceability, alarms, runbooks, and audit</text>

  <rect x="1405" y="255" width="295" height="92" rx="16" class="card"/>
  <circle cx="1438" cy="301" r="21" class="aws"/>
  <text x="1475" y="294" class="box-title">DynamoDB Audit Table</text>
  <text x="1475" y="318" class="box-text">request_id, policy, action, latency</text>

  <rect x="1405" y="400" width="295" height="92" rx="16" class="card"/>
  <circle cx="1438" cy="446" r="21" class="blue"/>
  <text x="1475" y="439" class="box-title">CloudWatch</text>
  <text x="1475" y="463" class="box-text">Logs, metrics, dashboard, alarms</text>

  <rect x="1405" y="545" width="295" height="92" rx="16" class="card"/>
  <circle cx="1438" cy="591" r="21" class="purple"/>
  <text x="1475" y="584" class="box-title">CloudTrail + S3 Evidence</text>
  <text x="1475" y="608" class="box-text">API changes and governance proof</text>

  <rect x="1405" y="690" width="295" height="92" rx="16" class="card"/>
  <circle cx="1438" cy="736" r="21" class="green"/>
  <text x="1475" y="729" class="box-title">Runbooks and Release Gate</text>
  <text x="1475" y="753" class="box-text">Tests, approvals, operational response</text>

  <path d="M325 301 H465" class="line"/>
  <path d="M210 347 V400" class="line-green"/>
  <path d="M210 492 V545" class="line-green"/>
  <path d="M615 347 V400" class="line"/>
  <path d="M615 492 V545" class="line"/>
  <path d="M765 591 H930" class="line"/>
  <path d="M1095 367 V415" class="line-purple"/>
  <path d="M1095 527 V575" class="line-purple"/>
  <path d="M1095 687 V735" class="line-purple"/>
  <path d="M1260 311 H1405" class="line-green"/>
  <path d="M1260 631 H1405" class="line-green"/>
  <path d="M1260 791 C1320 791 1345 591 1405 591" class="line-muted"/>
  <path d="M1260 471 C1325 471 1340 446 1405 446" class="line-purple"/>
  <path d="M765 736 C820 736 860 471 930 471" class="line-muted"/>

  <rect x="75" y="965" width="1650" height="90" rx="18" fill="#0d1f25" stroke="#2f4a55" stroke-width="1.3"/>
  <rect x="105" y="995" width="145" height="30" rx="15" class="badge"/>
  <text x="128" y="1015" class="badge-text">PRODUCTION NOTES</text>
  <text x="280" y="1006" class="box-text">Policy changes go through pull request, governance tests, Terraform validation, security approval, and release evidence capture.</text>
  <text x="280" y="1032" class="box-text">Critical blocks such as credential exfiltration and sensitive identifiers alert through CloudWatch and are traceable by request ID.</text>
</svg>
