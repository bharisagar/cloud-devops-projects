<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise AI Governance Platform on ECS</title>
  <desc id="desc">High-level AWS architecture showing API Gateway, VPC Link, ECS Fargate, Bedrock, SageMaker, DynamoDB, CloudWatch, CloudTrail, and S3.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06121f"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #94a3b8; }
      .section { font: 700 15px Arial, sans-serif; fill: #cbd5e1; letter-spacing: 1px; }
      .card-title { font: 700 15px Arial, sans-serif; fill: #f8fafc; }
      .card-sub { font: 400 12px Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #94a3b8; }
      .line { stroke: #67e8f9; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line-muted { stroke: #64748b; stroke-width: 1.8; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .aws { font: 700 12px Arial, sans-serif; fill: #111827; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="54" y="54" class="title">Enterprise AI Governance Platform on AWS</text>
  <text x="54" y="82" class="subtitle">API Gateway + Private ECS Fargate + Bedrock/SageMaker + audit, monitoring, security, and cost controls</text>

  <rect x="44" y="118" width="260" height="510" rx="22" fill="#07111f" stroke="#1e293b"/>
  <text x="68" y="152" class="section">CONSUMERS</text>

  <rect x="78" y="192" width="188" height="78" rx="16" fill="#0f766e" filter="url(#shadow)"/>
  <circle cx="106" cy="230" r="18" fill="#f59e0b"/>
  <text x="98" y="235" class="aws">APP</text>
  <text x="136" y="222" class="card-title">Customer App</text>
  <text x="136" y="244" class="card-sub">Web, mobile, internal tools</text>

  <rect x="78" y="316" width="188" height="78" rx="16" fill="#155e75" filter="url(#shadow)"/>
  <circle cx="106" cy="354" r="18" fill="#f59e0b"/>
  <text x="97" y="359" class="aws">SSO</text>
  <text x="136" y="346" class="card-title">Identity Layer</text>
  <text x="136" y="368" class="card-sub">IAM, OIDC, Cognito</text>

  <rect x="350" y="118" width="470" height="510" rx="22" fill="#07111f" stroke="#1e293b"/>
  <text x="374" y="152" class="section">PRIVATE APPLICATION PLATFORM</text>

  <rect x="396" y="190" width="168" height="78" rx="16" fill="#1d4ed8" filter="url(#shadow)"/>
  <circle cx="424" cy="228" r="18" fill="#f59e0b"/>
  <text x="414" y="233" class="aws">API</text>
  <text x="454" y="220" class="card-title">API Gateway</text>
  <text x="454" y="242" class="card-sub">HTTP API routes</text>

  <rect x="610" y="190" width="168" height="78" rx="16" fill="#0e7490" filter="url(#shadow)"/>
  <circle cx="638" cy="228" r="18" fill="#f59e0b"/>
  <text x="628" y="233" class="aws">VPC</text>
  <text x="668" y="220" class="card-title">VPC Link</text>
  <text x="668" y="242" class="card-sub">Private integration</text>

  <rect x="396" y="316" width="168" height="78" rx="16" fill="#7c2d12" filter="url(#shadow)"/>
  <circle cx="424" cy="354" r="18" fill="#f59e0b"/>
  <text x="413" y="359" class="aws">ALB</text>
  <text x="454" y="346" class="card-title">Internal ALB</text>
  <text x="454" y="368" class="card-sub">Private target routing</text>

  <rect x="610" y="316" width="168" height="78" rx="16" fill="#047857" filter="url(#shadow)"/>
  <circle cx="638" cy="354" r="18" fill="#f59e0b"/>
  <text x="627" y="359" class="aws">ECS</text>
  <text x="668" y="346" class="card-title">Fargate Service</text>
  <text x="668" y="368" class="card-sub">AI gateway container</text>

  <rect x="396" y="450" width="382" height="86" rx="16" fill="#111827" stroke="#334155"/>
  <text x="424" y="482" class="card-title">Private AWS Service Access</text>
  <text x="424" y="507" class="card-sub">ECR, CloudWatch Logs, STS, S3, DynamoDB, Bedrock Runtime via VPC endpoints</text>

  <rect x="876" y="118" width="360" height="510" rx="22" fill="#07111f" stroke="#1e293b"/>
  <text x="900" y="152" class="section">AI, GOVERNANCE, AND EVIDENCE</text>

  <rect x="920" y="190" width="252" height="78" rx="16" fill="#4c1d95" filter="url(#shadow)"/>
  <circle cx="948" cy="228" r="18" fill="#f59e0b"/>
  <text x="936" y="233" class="aws">BR</text>
  <text x="978" y="220" class="card-title">Amazon Bedrock Guardrails</text>
  <text x="978" y="242" class="card-sub">Input and output controls</text>

  <rect x="920" y="302" width="252" height="78" rx="16" fill="#1e40af" filter="url(#shadow)"/>
  <circle cx="948" cy="340" r="18" fill="#f59e0b"/>
  <text x="936" y="345" class="aws">SM</text>
  <text x="978" y="332" class="card-title">SageMaker Endpoint</text>
  <text x="978" y="354" class="card-sub">Optional custom model path</text>

  <rect x="920" y="414" width="252" height="78" rx="16" fill="#92400e" filter="url(#shadow)"/>
  <circle cx="948" cy="452" r="18" fill="#f59e0b"/>
  <text x="936" y="457" class="aws">DDB</text>
  <text x="978" y="444" class="card-title">DynamoDB Audit</text>
  <text x="978" y="466" class="card-sub">Request and policy evidence</text>

  <rect x="920" y="526" width="252" height="78" rx="16" fill="#164e63" filter="url(#shadow)"/>
  <circle cx="948" cy="564" r="18" fill="#f59e0b"/>
  <text x="938" y="569" class="aws">OBS</text>
  <text x="978" y="556" class="card-title">CloudWatch, CloudTrail, S3</text>
  <text x="978" y="578" class="card-sub">Monitoring and audit storage</text>

  <path class="line" d="M266 230 H396"/>
  <path class="line" d="M564 229 H610"/>
  <path class="line" d="M694 268 V316"/>
  <path class="line" d="M610 355 H564"/>
  <path class="line" d="M564 355 H610"/>
  <path class="line" d="M778 354 H920"/>
  <path class="line-muted" d="M778 354 C840 354 840 340 920 340"/>
  <path class="line" d="M778 390 C850 430 860 452 920 452"/>
  <path class="line-muted" d="M704 394 C760 520 820 564 920 564"/>
  <path class="line-muted" d="M610 493 H920"/>

  <text x="54" y="674" class="tiny">Design intent: keep the AI runtime private, expose only the managed API boundary, and store repeatable evidence for security, monitoring, latency, cost, and audit reviews.</text>
</svg>
