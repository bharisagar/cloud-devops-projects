<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise AI Governance Gateway on AWS</title>
  <desc id="desc">AWS architecture diagram for API Gateway, VPC Link, internal Application Load Balancer, ECS Fargate, Bedrock Nova Pro, optional SageMaker Llama endpoint, DynamoDB audit records, CloudWatch, CloudTrail, S3, IAM, and VPC endpoints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <style>
      .h1 { font: 700 34px Arial, sans-serif; fill: #f8fafc; }
      .h2 { font: 700 18px Arial, sans-serif; fill: #e2e8f0; letter-spacing: .7px; }
      .muted { font: 400 15px Arial, sans-serif; fill: #94a3b8; }
      .small { font: 400 12px Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #94a3b8; }
      .svc-title { font: 700 15px Arial, sans-serif; fill: #f8fafc; }
      .svc-sub { font: 400 12px Arial, sans-serif; fill: #cbd5e1; }
      .badge { font: 700 11px Arial, sans-serif; fill: #111827; }
      .line { stroke: #38bdf8; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .line-alt { stroke: #a78bfa; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line-muted { stroke: #64748b; stroke-width: 1.9; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .boundary { fill: #020617; stroke: #243449; stroke-width: 1.4; }
      .tile { fill: #0f172a; stroke: #334155; stroke-width: 1.2; filter: url(#shadow); }
      .orange { fill: #ff9900; }
      .blue { fill: #2563eb; }
      .green { fill: #059669; }
      .purple { fill: #7c3aed; }
      .red { fill: #dc2626; }
    </style>
  </defs>

  <rect width="1600" height="940" fill="url(#bg)"/>
  <text x="60" y="62" class="h1">Enterprise AI Governance Gateway on AWS</text>
  <text x="60" y="94" class="muted">Private ECS AI gateway with Bedrock Nova Pro, optional SageMaker Llama endpoint, audit evidence, monitoring, latency alarms, and cost visibility</text>

  <rect x="50" y="130" width="250" height="660" rx="24" class="boundary"/>
  <text x="78" y="168" class="h2">CONSUMER LAYER</text>

  <rect x="82" y="214" width="186" height="90" rx="16" class="tile"/>
  <circle cx="116" cy="259" r="21" class="orange"/>
  <path d="M105 259 h22 M116 248 v22" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
  <text x="150" y="252" class="svc-title">Client App</text>
  <text x="150" y="274" class="svc-sub">Web, portal, API user</text>

  <rect x="82" y="354" width="186" height="90" rx="16" class="tile"/>
  <circle cx="116" cy="399" r="21" class="orange"/>
  <path d="M106 399 h20 M116 389 a10 10 0 1 1 0 20" stroke="#111827" stroke-width="3" fill="none"/>
  <text x="150" y="392" class="svc-title">Identity</text>
  <text x="150" y="414" class="svc-sub">OIDC / Cognito ready</text>

  <rect x="350" y="130" width="520" height="660" rx="24" class="boundary"/>
  <text x="378" y="168" class="h2">PRIVATE APPLICATION PLATFORM</text>

  <rect x="390" y="214" width="190" height="90" rx="16" class="tile"/>
  <circle cx="424" cy="259" r="21" class="orange"/>
  <path d="M414 247 l20 12 l-20 12 z" fill="#111827"/>
  <text x="458" y="252" class="svc-title">Amazon API Gateway</text>
  <text x="458" y="274" class="svc-sub">HTTP API /prompt</text>

  <rect x="640" y="214" width="190" height="90" rx="16" class="tile"/>
  <circle cx="674" cy="259" r="21" class="orange"/>
  <path d="M665 253 q9 -9 18 0 M665 265 q9 9 18 0" stroke="#111827" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="708" y="252" class="svc-title">API Gateway VPC Link</text>
  <text x="708" y="274" class="svc-sub">Private integration</text>

  <rect x="390" y="370" width="190" height="90" rx="16" class="tile"/>
  <circle cx="424" cy="415" r="21" class="orange"/>
  <path d="M410 419 h28 M414 409 h20 M419 399 h10" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
  <text x="458" y="408" class="svc-title">Internal ALB</text>
  <text x="458" y="430" class="svc-sub">Private target group</text>

  <rect x="640" y="370" width="190" height="90" rx="16" class="tile"/>
  <circle cx="674" cy="415" r="21" class="orange"/>
  <path d="M662 405 h24 v20 h-24z M668 399 h12 M668 431 h12" stroke="#111827" stroke-width="3" fill="none"/>
  <text x="708" y="408" class="svc-title">Amazon ECS Fargate</text>
  <text x="708" y="430" class="svc-sub">FastAPI governance app</text>

  <rect x="390" y="526" width="440" height="92" rx="16" class="tile"/>
  <circle cx="424" cy="572" r="21" class="orange"/>
  <path d="M413 572 h22 M424 561 v22 M416 564 l16 16 M432 564 l-16 16" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
  <text x="458" y="565" class="svc-title">VPC Endpoints</text>
  <text x="458" y="588" class="svc-sub">Bedrock Runtime, ECR, CloudWatch Logs, STS, S3, DynamoDB</text>

  <rect x="930" y="130" width="300" height="660" rx="24" class="boundary"/>
  <text x="958" y="168" class="h2">MODEL PROVIDERS</text>

  <rect x="970" y="214" width="220" height="100" rx="16" class="tile"/>
  <circle cx="1006" cy="264" r="22" class="orange"/>
  <path d="M995 264 l11 -15 l11 15 l-11 15z" fill="#111827"/>
  <text x="1042" y="252" class="svc-title">Amazon Bedrock</text>
  <text x="1042" y="274" class="svc-sub">Nova Pro baseline</text>
  <text x="1042" y="294" class="tiny">Guardrails enabled</text>

  <rect x="970" y="382" width="220" height="100" rx="16" class="tile"/>
  <circle cx="1006" cy="432" r="22" class="orange"/>
  <path d="M994 444 h24 M998 438 v-20 M1006 438 v-30 M1014 438 v-12" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
  <text x="1042" y="420" class="svc-title">Amazon SageMaker</text>
  <text x="1042" y="442" class="svc-sub">Llama 3.1 8B endpoint</text>
  <text x="1042" y="462" class="tiny">Optional custom model path</text>

  <rect x="970" y="550" width="220" height="100" rx="16" class="tile"/>
  <circle cx="1006" cy="600" r="22" class="orange"/>
  <path d="M996 588 h20 v24 h-20z M1000 592 h12 M1000 600 h12 M1000 608 h12" stroke="#111827" stroke-width="3" fill="none"/>
  <text x="1042" y="588" class="svc-title">Model Policy</text>
  <text x="1042" y="610" class="svc-sub">routing, quotas, fallback</text>
  <text x="1042" y="630" class="tiny">Nova Lite / Claude Sonnet 4.6 option</text>

  <rect x="1280" y="130" width="270" height="660" rx="24" class="boundary"/>
  <text x="1308" y="168" class="h2">EVIDENCE &amp; OPS</text>

  <rect x="1312" y="214" width="206" height="82" rx="16" class="tile"/>
  <circle cx="1346" cy="255" r="20" class="orange"/>
  <ellipse cx="1346" cy="246" rx="13" ry="6" fill="#111827"/>
  <path d="M1333 246 v18 c0 4 26 4 26 0 v-18" stroke="#111827" stroke-width="3" fill="none"/>
  <text x="1380" y="248" class="svc-title">DynamoDB</text>
  <text x="1380" y="270" class="svc-sub">AI audit table</text>

  <rect x="1312" y="336" width="206" height="82" rx="16" class="tile"/>
  <circle cx="1346" cy="377" r="20" class="orange"/>
  <path d="M1335 389 h24 M1338 382 v-15 M1346 382 v-24 M1354 382 v-10" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
  <text x="1380" y="370" class="svc-title">CloudWatch</text>
  <text x="1380" y="392" class="svc-sub">logs, metrics, alarms</text>

  <rect x="1312" y="458" width="206" height="82" rx="16" class="tile"/>
  <circle cx="1346" cy="499" r="20" class="orange"/>
  <path d="M1335 492 c12 -12 22 -12 22 0 c0 10 -18 10 -18 20" stroke="#111827" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="1380" y="492" class="svc-title">CloudTrail</text>
  <text x="1380" y="514" class="svc-sub">AWS API audit</text>

  <rect x="1312" y="580" width="206" height="82" rx="16" class="tile"/>
  <circle cx="1346" cy="621" r="20" class="orange"/>
  <path d="M1334 612 h24 v20 h-24z M1338 608 h16" stroke="#111827" stroke-width="3" fill="none"/>
  <text x="1380" y="614" class="svc-title">Amazon S3</text>
  <text x="1380" y="636" class="svc-sub">evidence bucket</text>

  <rect x="1312" y="702" width="206" height="62" rx="16" class="tile"/>
  <circle cx="1346" cy="733" r="18" class="orange"/>
  <path d="M1338 733 h16 M1346 725 v16" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
  <text x="1380" y="727" class="svc-title">IAM + Budgets</text>
  <text x="1380" y="747" class="svc-sub">least privilege, tags</text>

  <path class="line" d="M268 259 H390"/>
  <path class="line" d="M580 259 H640"/>
  <path class="line" d="M735 304 V370"/>
  <path class="line" d="M640 415 H580"/>
  <path class="line" d="M580 415 H640"/>
  <path class="line" d="M830 415 H930 C948 415 952 264 970 264"/>
  <path class="line-alt" d="M830 425 H910 C948 425 952 432 970 432"/>
  <path class="line-muted" d="M750 460 C820 520 875 585 970 600"/>
  <path class="line" d="M830 415 C1010 425 1128 250 1312 255"/>
  <path class="line-muted" d="M765 460 C930 520 1110 375 1312 377"/>
  <path class="line-muted" d="M1190 264 C1260 315 1270 498 1312 499"/>
  <path class="line-muted" d="M1190 264 C1260 360 1270 620 1312 621"/>
  <path class="line-muted" d="M610 618 C860 720 1080 733 1312 733"/>

  <rect x="390" y="830" width="1160" height="58" rx="18" fill="#0b1220" stroke="#334155"/>
  <text x="420" y="855" class="small">Primary production path: API Gateway -> VPC Link -> Internal ALB -> ECS Fargate -> Bedrock Nova Pro + Guardrails -> DynamoDB + CloudWatch + CloudTrail/S3.</text>
  <text x="420" y="876" class="tiny">Optional custom-model path: ECS Fargate -> SageMaker Llama 3.1 8B Instruct endpoint. Use only when custom model ownership and MLOps justify the endpoint cost.</text>
</svg>
