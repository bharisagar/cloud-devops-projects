name: Day 15 Secret Exposure Response CI

on:
  push:
    paths:
      - "30-days-cloud-devops-projects/day-15-secret-exposure-drill/**"
      - ".github/workflows/day-15-secret-response.yml"
  pull_request:
    paths:
      - "30-days-cloud-devops-projects/day-15-secret-exposure-drill/**"
      - ".github/workflows/day-15-secret-response.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 30-days-cloud-devops-projects/day-15-secret-exposure-drill
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner tests
        run: python -m unittest discover -s tests -v
      - name: Verify clean sample
        run: python scan.py sample-clean.env.txt
      - name: Verify risky sample and generate report
        run: |
          if python scan.py sample.env.txt --output-json reports/scan-report.json --output-md reports/scan-report.md; then
            echo "Expected sample risk was not detected" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi
          test -s reports/scan-report.json
          test -s reports/scan-report.md
          python -c 'import json; r=json.load(open("reports/scan-report.json")); assert r["decision"] == "BLOCK AND TRIAGE" and len(r["findings"]) == 1'
      - uses: actions/upload-artifact@v4
        with:
          name: day-15-redacted-report
          path: |
            30-days-cloud-devops-projects/day-15-secret-exposure-drill/reports/scan-report.json
            30-days-cloud-devops-projects/day-15-secret-exposure-drill/reports/scan-report.md
