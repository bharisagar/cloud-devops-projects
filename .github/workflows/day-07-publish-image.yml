name: Day 7 Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish"
        required: true
        default: "latest"

jobs:
  publish-dockerhub:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 30-days-cloud-devops-projects/day-07-push-docker-image-to-registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/day-07-registry-api:${{ inputs.image_tag }}" .

      - name: Push image
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/day-07-registry-api:${{ inputs.image_tag }}"
