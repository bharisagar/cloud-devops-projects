name: Day 16 Dependency Policy CI

on:
  push:
    paths:
      - "30-days-cloud-devops-projects/day-16-dependency-policy/**"
      - ".github/workflows/day-16-dependency-policy.yml"
  pull_request:
    paths:
      - "30-days-cloud-devops-projects/day-16-dependency-policy/**"
      - ".github/workflows/day-16-dependency-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 30-days-cloud-devops-projects/day-16-dependency-policy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run policy tests
        run: python -m unittest discover -s tests -v
      - name: Verify clean and risky samples
        run: bash scripts/run-demo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: day-16-policy-report
          path: |
            30-days-cloud-devops-projects/day-16-dependency-policy/reports/policy-report.json
            30-days-cloud-devops-projects/day-16-dependency-policy/reports/policy-report.md
